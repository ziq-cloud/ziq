<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAXA Live Overlay</title>
<style>
@font-face { font-family: "Oxanium"; font-weight: 500; src: url(data:font/woff;base64,__FONT__) format("woff"); }
:root {
  --gold: #e2b25c; --gold-hi: #ffe296; --gold-lo: #a0702c;
  --red: #e05458; --blue: #488ce8; --ink: #fff; --muted: #c9c0b2;
  --glass: rgba(14, 12, 10, .78); --line: rgba(226, 178, 92, .55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Oxanium", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }

/* 1080x1920 stage, scaled to fit whatever size the browser source is */
#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; }

/* ---------- brand card ---------- */
#card {
  position: absolute; top: var(--y, 300px); left: 36px;
  display: flex; align-items: center; gap: 22px;
  padding: 20px 30px 20px 20px; border-radius: 30px;
  background: var(--glass); border: 2px solid var(--line);
  box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 34px rgba(226,178,92,.18);
  animation: in .8s cubic-bezier(.2,.9,.3,1.2) both;
}
.right #card { left: auto; right: 36px; }
#card img { width: 104px; height: 104px; border-radius: 24px; display: block; }
.brand { font-size: 30px; letter-spacing: 2px; color: var(--muted); line-height: 1.1; }
.brand b { color: var(--ink); font-weight: 500; letter-spacing: 4px; }
.codewrap { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; }
.codelabel { font-size: 26px; color: var(--muted); }
.code {
  font-size: 60px; letter-spacing: 5px; line-height: 1;
  background: linear-gradient(100deg, var(--gold-lo) 0%, var(--gold-hi) 25%, var(--gold) 45%, var(--gold-hi) 55%, var(--gold-lo) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 4s linear infinite;
}
.sub { font-size: 24px; color: var(--gold-hi); margin-top: 6px; opacity: .9; }

/* ---------- rotating message ---------- */
#msg {
  position: absolute; top: calc(var(--y, 300px) + 192px); left: 36px; max-width: 760px;
  padding: 16px 26px 16px 22px; border-radius: 20px;
  background: var(--glass); border-left: 6px solid var(--gold);
  font-size: 32px; line-height: 1.25;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
  transition: opacity .5s, transform .5s;
}
.right #msg { left: auto; right: 36px; border-left: 0; border-right: 6px solid var(--gold); text-align: right; }
#msg.out { opacity: 0; transform: translateY(14px); }

/* ---------- risk strip ---------- */
#risk {
  position: absolute; top: calc(var(--y, 300px) - 58px); left: 36px;
  font-size: 22px; color: rgba(255,255,255,.82); letter-spacing: .5px;
  padding: 6px 16px; border-radius: 12px; background: rgba(0,0,0,.5);
}
.right #risk { left: auto; right: 36px; }

/* ---------- periodic call-to-action pop ---------- */
#pop {
  position: absolute; left: 440px; top: 800px; width: 800px; transform: translate(-50%, 40px) scale(.9);
  opacity: 0; pointer-events: none; text-align: center;
  padding: 34px 40px 38px; border-radius: 38px;
  background: linear-gradient(160deg, rgba(30,26,20,.94), rgba(10,9,8,.94));
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 8px rgba(226,178,92,.12), 0 20px 70px rgba(0,0,0,.6), 0 0 80px rgba(226,178,92,.35);
  transition: opacity .6s, transform .6s cubic-bezier(.2,.9,.3,1.25);
}
#pop.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#pop .t1 { font-size: 40px; color: var(--muted); }
#pop .t2 { font-size: 112px; letter-spacing: 10px; margin: 8px 0 6px; line-height: 1; }
#pop .t3 { font-size: 34px; color: var(--gold-hi); }
#pop .bars { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
#pop .bars i { width: 70px; height: 8px; border-radius: 4px; background: var(--red); }
#pop .bars i:nth-child(2) { background: var(--gold); } #pop .bars i:nth-child(3) { background: var(--blue); }

@keyframes in { from { opacity: 0; transform: translateY(-20px) scale(.96); } }
@keyframes shine { to { background-position: -250% 0; } }
@media (prefers-reduced-motion: reduce) { .code { animation: none; } }

/* ---------- preview mode (never shown inside OBS / LIVE Studio) ---------- */
body.preview { background: #1d1a17; overflow: auto; }
body.preview #stage { background: linear-gradient(180deg, #3a3f4a, #23262d 55%, #14161a); border-radius: 40px; overflow: hidden; }
.mock { display: none; position: absolute; border: 3px dashed rgba(255,90,90,.75); background: rgba(255,60,60,.12);
  color: rgba(255,200,200,.9); font: 26px system-ui, sans-serif; padding: 14px; }
body.preview .mock { display: block; }
#panel { display: none; }
body.preview #panel {
  display: block; position: fixed; right: 16px; top: 16px; width: 340px; max-height: calc(100% - 32px); overflow: auto;
  background: #fff; color: #222; font: 14px/1.4 system-ui, sans-serif; border-radius: 14px; padding: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5); z-index: 9;
}
#panel h2 { font-size: 16px; margin-bottom: 8px; }
#panel label { display: block; margin-top: 10px; font-weight: 600; }
#panel input, #panel textarea, #panel select { width: 100%; font: inherit; padding: 6px 8px; margin-top: 4px; border: 1px solid #bbb; border-radius: 8px; }
#panel textarea { height: 120px; }
#panel button { margin-top: 12px; padding: 8px 12px; border: 0; border-radius: 8px; background: #a0702c; color: #fff; font: inherit; cursor: pointer; }
#panel .note { color: #666; font-size: 12px; margin-top: 8px; }
@media (max-width: 760px) { body.preview #panel { position: static; width: auto; margin: 12px; } }
</style>
</head>
<body>
<div id="stage">
  <!-- TikTok LIVE UI zones (preview only) -->
  <div class="mock" style="left:0;top:0;width:1080px;height:230px">Nama host, viewer, butang tutup (TikTok)</div>
  <div class="mock" style="left:0;top:1180px;width:820px;height:600px">Komen penonton</div>
  <div class="mock" style="left:880px;top:900px;width:200px;height:880px">Butang gift / share</div>
  <div class="mock" style="left:0;top:1800px;width:1080px;height:120px">Kotak taip komen</div>

  <div id="risk"></div>
  <div id="card">
    <img alt="" src="data:image/png;base64,__ICON__">
    <div>
      <div class="brand"><b>TRAXA</b> <span id="brandSub"></span></div>
      <div class="codewrap"><span class="codelabel" id="codeLabel"></span><span class="code" id="code"></span></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="pop">
    <div class="t1" id="popT1"></div>
    <div class="t2 code" id="popCode"></div>
    <div class="t3" id="popT3"></div>
    <div class="bars"><i></i><i></i><i></i></div>
  </div>
</div>

<div id="panel">
  <h2>Tetapan overlay</h2>
  <label>Kod jemputan <input id="fCode"></label>
  <label>Bahasa
    <select id="fLang"><option value="bm">Bahasa Melayu</option><option value="en">English</option></select></label>
  <label>Kedudukan
    <select id="fPos"><option value="left">Kiri</option><option value="right">Kanan</option></select></label>
  <label>Jarak dari atas (px, 1080×1920) <input id="fY" type="number" step="10"></label>
  <label>Pop-up besar setiap (minit, 0 = tutup) <input id="fPop" type="number" min="0" step="0.5"></label>
  <label>Mesej bergilir (satu baris satu mesej, kosong = default) <textarea id="fMsgs"></textarea></label>
  <button id="apply">Kemas kini pratonton</button>
  <button id="copy">Salin URL overlay</button>
  <p class="note">Kawasan merah = UI TikTok LIVE yang menutup skrin. Pastikan overlay tidak bertindih. URL yang disalin tiada <code>preview=1</code>, itu yang dimasukkan dalam LIVE Studio / OBS.</p>
</div>

<script>
const TEXT = {
  bm: {
    brandSub: "Trading App", codeLabel: "Kod jemputan", sub: "Link di bio ↓",
    risk: "⚠ Trading berisiko tinggi · Bukan nasihat kewangan",
    popT1: "Nak cuba TRAXA? Guna kod jemputan", popT3: "Link di bio · daftar percuma",
    msgs: [
      "Setiap setup tunjuk paras harga penting + sebab ia dihantar",
      "Notifikasi setup baru, berita pasaran & zon harga",
      "Kelas asas untuk pemula dalam app",
      "Tanya apa-apa di komen — saya jawab live",
    ],
  },
  en: {
    brandSub: "Trading App", codeLabel: "Invite code", sub: "Link in bio ↓",
    risk: "⚠ Trading involves high risk · Not financial advice",
    popT1: "Want to try TRAXA? Use invite code", popT3: "Link in bio · free sign-up",
    msgs: [
      "Every setup shows the key price levels and the reason",
      "Alerts for new setups, market news and price zones",
      "Built-in lessons for beginners",
      "Drop your questions in the comments",
    ],
  },
};
const P = new URLSearchParams(location.search);
const cfg = {
  code: (P.get("code") || "ZIQFX").toUpperCase(),
  lang: TEXT[P.get("lang")] ? P.get("lang") : "bm",
  pos: P.get("pos") === "right" ? "right" : "left",
  y: Number(P.get("y")) || 300,
  pop: P.has("pop") ? Math.max(0, Number(P.get("pop")) || 0) : 3,
  msgs: (P.get("msgs") || "").split("|").map(s => s.trim()).filter(Boolean),
  preview: P.get("preview") === "1",
};
const $ = id => document.getElementById(id);
const T = TEXT[cfg.lang];
const msgs = cfg.msgs.length ? cfg.msgs : T.msgs;

document.body.classList.toggle("right", cfg.pos === "right");
document.body.classList.toggle("preview", cfg.preview);
$("stage").style.setProperty("--y", cfg.y + "px");
$("code").textContent = $("popCode").textContent = cfg.code;
for (const k of ["brandSub", "codeLabel", "sub", "risk", "popT1", "popT3"]) $(k).textContent = T[k];

// scale the 1080x1920 stage to the source size
function fit() {
  const pad = cfg.preview ? 24 : 0;
  const w = cfg.preview && innerWidth > 760 ? innerWidth - 380 : innerWidth;
  const s = Math.min((w - pad * 2) / 1080, (innerHeight - pad * 2) / 1920);
  const stage = $("stage");
  stage.style.left = cfg.preview && innerWidth > 760 ? (w / 2) + "px" : "50%";
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

// rotating message
let mi = 0; const msgEl = $("msg");
msgEl.textContent = msgs[0];
if (msgs.length > 1) setInterval(() => {
  msgEl.classList.add("out");
  setTimeout(() => { mi = (mi + 1) % msgs.length; msgEl.textContent = msgs[mi]; msgEl.classList.remove("out"); }, 500);
}, 7000);

// periodic big call-to-action (also: click / press P to show it now)
const pop = $("pop");
function showPop() { pop.classList.add("show"); setTimeout(() => pop.classList.remove("show"), 12000); }
if (cfg.pop > 0) { setTimeout(showPop, 20000); setInterval(showPop, cfg.pop * 60000); }
addEventListener("keydown", e => { if (e.key === "p" || e.key === "P") showPop(); });
$("stage").addEventListener("click", showPop);

// preview settings panel
if (cfg.preview) {
  $("fCode").value = cfg.code; $("fLang").value = cfg.lang; $("fPos").value = cfg.pos;
  $("fY").value = cfg.y; $("fPop").value = cfg.pop; $("fMsgs").value = cfg.msgs.join("\n");
  const build = preview => {
    const q = new URLSearchParams();
    q.set("code", $("fCode").value.trim() || "ZIQFX"); q.set("lang", $("fLang").value);
    q.set("pos", $("fPos").value); q.set("y", $("fY").value || 300); q.set("pop", $("fPop").value || 0);
    const m = $("fMsgs").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (m.length) q.set("msgs", m.join("|"));
    if (preview) q.set("preview", "1");
    return location.href.split(/[?#]/)[0] + "?" + q.toString();
  };
  $("apply").onclick = () => { location.href = build(true); };
  $("copy").onclick = async () => {
    const url = build(false);
    try { await navigator.clipboard.writeText(url); $("copy").textContent = "Disalin ✓"; }
    catch { prompt("Salin URL ini:", url); }
  };
}
</script>
</body>
</html>
