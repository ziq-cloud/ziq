name: Telegram morning quote

on:
  schedule:
    # 23:45 UTC = 7:45 pagi waktu Malaysia (UTC+8), setiap hari.
    # GitHub boleh lewat 5-15 minit pada waktu sibuk.
    - cron: "45 23 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post quote to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram-motivation/post_quote.py
